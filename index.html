<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokki's Board Prep</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-dark: #334155;
            --text-light: #64748b;
            --correct: #22c55e;
            --wrong: #ef4444;
            --rationale-bg: #e0f2fe;
            --rationale-text: #0369a1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 750px;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Home Screen Styles */
        .home-screen {
            text-align: center;
        }

        .home-screen h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .home-screen p {
            color: var(--text-light);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .day-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .day-btn {
            background-color: var(--bg-color);
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .day-btn:hover {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Quiz Screen Styles */
        .quiz-screen {
            display: none;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .back-home-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0;
        }

        .back-home-btn:hover {
            color: var(--primary);
        }

        .progress {
            font-size: 0.9rem;
            color: var(--text-light);
            font-weight: 600;
        }

        .question {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--bg-color);
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 1rem;
            color: var(--text-dark);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: var(--correct);
            color: #166534;
        }

        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--wrong);
            color: #991b1b;
        }

        .rationale-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background-color: var(--rationale-bg);
            color: var(--rationale-text);
            border-left: 4px solid var(--primary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .rationale-box strong {
            display: block;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }

        .nav-btn {
            background-color: #cbd5e1;
            color: var(--text-dark);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: #94a3b8;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #next-btn {
            background-color: var(--primary);
            color: white;
        }

        #next-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        /* Results Screen Styles */
        .results-screen {
            text-align: center;
            display: none;
        }

        .results-screen h2 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .results-screen p {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 25px;
        }

        .results-details {
            text-align: left;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-size: 1rem;
            color: var(--text-dark);
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        
        <!-- HOME / DAY SELECTOR SCREEN -->
        <div class="home-screen" id="home-screen">
            <h1>Tokki's Board Prep 🦷</h1>
            <p>Select your mock exam day to begin reviewing:</p>
            <div class="day-buttons">
                <button class="day-btn" onclick="startExam('day1')">Day 1 Mock Exam (100 Items)</button>
                <button class="day-btn" onclick="startExam('day2')">Day 2 Mock Exam</button>
                <button class="day-btn" onclick="startExam('day3')">Day 3 Mock Exam</button>
            </div>
        </div>

        <!-- QUIZ INTERACTIVE SCREEN -->
        <div class="quiz-screen" id="quiz-screen">
            <div class="quiz-header">
                <button class="back-home-btn" onclick="returnToHome()">← Exit to Home</button>
                <div class="progress" id="progress">Question 1 of 1</div>
            </div>

            <div class="question" id="question">Loading question...</div>
            <div class="options" id="options"></div>
            
            <div class="rationale-box" id="rationale-box">
                <strong>Explanation:</strong>
                <span id="rationale-text"></span>
            </div>

            <div class="controls">
                <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">Previous</button>
                <button class="nav-btn" id="next-btn" onclick="nextQuestion()">Next</button>
            </div>
        </div>

        <!-- RESULTS SCREEN -->
        <div class="results-screen" id="results-screen">
            <h2>Exam Complete!</h2>
            <p>You scored <strong id="score">0</strong> out of <span id="total">0</span>!</p>
            <div id="results-message" class="results-details"></div>
            <button class="day-btn" onclick="returnToHome()" style="background-color: var(--primary); color: white; border: none;">Back to Home</button>
        </div>

    </div>

    <script>
        // --- EXAM QUESTION BANKS ---

                "options": [

              },
              {
                "question": "A 45-year-old female presents with a white, lace-like network of lines (Wickham striae) on her bilateral buccal mucosa. A biopsy reveals a dense, band-like infiltrate of T-lymphocytes just beneath the epithelium and destruction of the basal cell layer. What is the definitive diagnosis?",

              },
              {
                "question": "During normal cardiac physiology, the Frank-Starling Law of the Heart states that:",

                "correct": 2,
                "rationale": "The Frank-Starling law essentially states that the more the heart chamber fills with blood during diastole (stretching the muscle fibers), the harder it will contract to pump that blood out during systole."
              },
              {
                "question": "Which of the following anatomical spaces is the most common site for the spread of an odontogenic infection originating from the apices of the mandibular second or third molars, potentially leading to Ludwig's Angina?",
                "options": [

                  "Submental space",

                "correct": 2,
                "rationale": "Because the apices of the mandibular 2nd and 3rd molars sit below the attachment of the mylohyoid muscle on the lingual aspect of the mandible, infections drain directly downward into the submandibular space. (Infections of incisors usually go to the submental space)."
              },
              {
                "question": "In the sliding filament theory of skeletal muscle contraction, which specific ion binds to troponin, causing tropomyosin to shift and expose the myosin-binding sites on the actin filament?",
                "options": [
                  "Sodium (Na<sup>+</sup>)",
                  "Potassium (K<sup>+</sup>)",
                  "Calcium (Ca<sup>2+</sup>)",
                  "Magnesium (Mg<sup>2+</sup>)"
                ],
                "correct": 2,
                "rationale": "Calcium (Ca<sup>2+</sup>) is the key trigger. Released from the sarcoplasmic reticulum, it binds to troponin, physically pulling the tropomyosin rope off the actin, allowing the myosin heads to grab on and contract the muscle."
              },
              {
                "question": "All of the following are classic radiographic and histological features of an Odontogenic Keratocyst (OKC) EXCEPT:",

                  "It has a highly prominent, palisaded basal cell layer (picket-fence appearance)."
                ],
                "correct": 1,
                "rationale": "This is the EXCEPT question. OKCs are distinct because their connective tissue walls are generally uninflamed and very thin. If they were heavily inflamed, the classic picket-fence histology of the epithelial lining would be destroyed."

              {
                "question": "A patient complains of pain when biting down perfectly straight, but no pain when chewing side-to-side. You suspect a fractured cusp. Which major structural ridge connects the mesiolingual and distobuccal cusps of the maxillary first molar and is the strongest ridge on the tooth?",

                  "Oblique ridge",

              {
                "question": "Which primary cell of acute inflammation arrives first at the site of tissue injury, utilizing the processes of margination, rolling, and diapedesis to exit the blood vessel?",

              {
                "question": "The submandibular duct (Wharton's duct) shares an intimate anatomical relationship with the lingual nerve in the floor of the mouth. As the duct travels anteriorly from the gland to the sublingual caruncle, the lingual nerve:",

                "rationale": "This is a classic anatomy board question. As the submandibular duct runs forward, the lingual nerve loops under it, moving from the lateral side to the medial side of the duct."
              },
              {
                "question": "A 60-year-old male smoker presents with a painless, indurated (hard) ulcer on the lateral border of his tongue that has not healed in 4 weeks. What is the most statistically probable histopathological diagnosis?",

                  "Squamous Cell Carcinoma (SCC)",
                  "Major Aphthous Ulcer",
                  "Syphilitic chancre"

                "correct": 1,
                "rationale": "A painless, hard, non-healing ulcer on the lateral border of the tongue in an older smoker is the textbook presentation of Squamous Cell Carcinoma until proven otherwise via biopsy."
              },
              {
                "question": "During tooth development (odontogenesis), which structure determines the size, shape, and number of roots a tooth will have?",

                  "The enamel organ",
                  "Hertwig's Epithelial Root Sheath (HERS)",
                  "The dental follicle",

              },
              {
                "question": "A patient in the dental chair suddenly experiences a severe Type I hypersensitivity (anaphylactic) reaction to a penicillin antibiotic. Which immunoglobulin is primarily mediating the massive degranulation of mast cells and release of histamine?",

              {

                "options": [
                  "Masseter",
                  "Temporalis",
                  "Medial pterygoid",
                  "Lateral pterygoid"
                ],
                "correct": 3,
                "rationale": "The Lateral Pterygoid is the only muscle of mastication that opens the mouth (depresses). The Masseter, Temporalis, and Medial Pterygoid all close the mouth (elevate)."
              },
              {
                "question": "Radiographically, a 55-year-old female's skull shows a diffuse \"cotton-wool\" appearance. Her maxilla is significantly enlarged, causing her upper denture to no longer fit. Dental x-rays show generalized hypercementosis of her teeth. Her serum alkaline phosphatase levels are highly elevated. What is the diagnosis?",
                "options": [
                  "Fibrous Dysplasia",
                  "Paget's Disease of Bone (Osteitis Deformans)",
                  "Multiple Myeloma",
                  "Osteomalacia"
                ],
                "correct": 1,
                "rationale": "\"Cotton-wool\" skull, hypercementosis, expanding maxilla, and high alkaline phosphatase are the absolute diagnostic keywords for Paget's Disease."
              },
              {
                "question": "In general cellular physiology, what is the primary function of the sodium-potassium pump (Na<sup>+</sup>/K<sup>+</sup> ATPase)?",
                "options": [
                  "To move 3 Na<sup>+</sup> into the cell and 2 K<sup>+</sup> out of the cell to trigger an action potential.",
                  "To move 3 Na<sup>+</sup> out of the cell and 2 K<sup>+</sup> into the cell to maintain the resting membrane potential.",
                  "To passively allow sodium to diffuse across the membrane during depolarization.",
                  "To synthesize ATP using the electrochemical gradient."
                ],
                "correct": 1,
                "rationale": "The pump actively uses ATP to throw 3 Na<sup>+</sup> out and bring 2 K<sup>+</sup> in. This maintains the negative resting membrane potential of the cell. (Option A describes depolarization, which is a passive influx of sodium, not the pump)."
              },
              {
                "question": "A 9-year-old boy presents with a bluish, fluid-filled, dome-shaped swelling on the alveolar ridge exactly where tooth #11 is scheduled to emerge. The lesion is asymptomatic. What is the most appropriate management for this Eruption Cyst?",

                  "No treatment; allow the tooth to erupt through it naturally",
                  "Marsupialization"

                "correct": 2,

        let currentDayKey = '';
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let userState = [];

        const homeScreen = document.getElementById('home-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const progressEl = document.getElementById('progress');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const rationaleBox = document.getElementById('rationale-box');
        const rationaleText = document.getElementById('rationale-text');

        // SHUFFLE FUNCTION
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startExam(dayKey) {
            currentDayKey = dayKey;
            
            // Clone the array so we can shuffle safely
            currentQuestions = [...examData[dayKey]];
            shuffleArray(currentQuestions);
            
            currentQuestionIndex = 0;

            userState = currentQuestions.map(() => ({
                selectedOption: null,
                isAnswered: false,
                isCorrect: false
            }));

            homeScreen.style.display = 'none';
            resultsScreen.style.display = 'none';
            quizScreen.style.display = 'block';

            loadQuestion();
        }

        function returnToHome() {
            quizScreen.style.display = 'none';
            resultsScreen.style.display = 'none';
            homeScreen.style.display = 'block';
        }

        function loadQuestion() {
            const qData = currentQuestions[currentQuestionIndex];
            const state = userState[currentQuestionIndex];

            progressEl.innerText = `Question ${currentQuestionIndex + 1} of ${currentQuestions.length}`;
            
            let cleanQuestionText = qData.question.replace(/^\d+\.\s*/, '');
            questionEl.innerHTML = cleanQuestionText.replace(/\n/g, '<br>');
            
            optionsEl.innerHTML = '';

            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.innerHTML = opt;
                btn.classList.add('option-btn');

                if (state.isAnswered) {
                    btn.disabled = true;
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    }
                    if (index === state.selectedOption && index !== qData.correct) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.addEventListener('click', () => selectOption(index));
                }

                optionsEl.appendChild(btn);
            });

            if (state.isAnswered) {
                rationaleText.innerHTML = qData.rationale;
                rationaleBox.style.display = 'block';
            } else {
                rationaleBox.style.display = 'none';
            }

            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtn.innerText = "Finish Exam";
            } else {
                nextBtn.innerText = "Next";
            }
        }

        function selectOption(selectedIndex) {
            const state = userState[currentQuestionIndex];
            if (state.isAnswered) return;

            state.isAnswered = true;
            state.selectedOption = selectedIndex;

            const qData = currentQuestions[currentQuestionIndex];
            const allButtons = optionsEl.children;

            if (selectedIndex === qData.correct) {
                allButtons[selectedIndex].classList.add('correct');
                state.isCorrect = true;
            } else {
                allButtons[selectedIndex].classList.add('wrong');
                allButtons[qData.correct].classList.add('correct');
                state.isCorrect = false;
            }

            for (let btn of allButtons) {
                btn.disabled = true;
            }

            rationaleText.innerHTML = qData.rationale;
            rationaleBox.style.display = 'block';
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.style.display = 'none';
            resultsScreen.style.display = 'block';

            let score = userState.filter(s => s.isCorrect).length;
            document.getElementById('score').innerText = score;
            document.getElementById('total').innerText = currentQuestions.length;

            const msgBox = document.getElementById('results-message');
            let percentage = (score / currentQuestions.length) * 100;
            if (percentage >= 90) {
                msgBox.innerHTML = "<strong>Amazing job!</strong> You are going to crush this board exam.";
            } else if (percentage >= 75) {
                msgBox.innerHTML = "<strong>Great work!</strong> You have a solid grasp on these concepts.";
            } else {
                msgBox.innerHTML = "<strong>Keep pushing!</strong> Review those explanations to prepare for Monday.";
            }
        }
    </script>
