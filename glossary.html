<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokki's Board Prep - Glossary</title>
    <!-- Connects to your global CSS file -->
    <link rel="stylesheet" href="css/style.css"> 
    
    <!-- INSTANT DARK MODE CHECK -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <style>
        .search-container { margin: 20px 0; display: flex; justify-content: center; }
        #glossarySearch {
            width: 100%; max-width: 600px; padding: 15px; font-size: 1.1rem;
            border: 2px solid var(--primary-light); border-radius: 12px;
            outline: none; background-color: var(--bg-color); color: var(--text-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: all 0.3s ease;
        }
        #glossarySearch:focus { box-shadow: 0 6px 12px rgba(140, 82, 255, 0.3); border-color: var(--primary); }
        .glossary-card {
            background: var(--bg-color); padding: 15px 20px; border-radius: 12px;
            margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary); transition: background-color 0.3s ease;
        }
        .glossary-term { color: var(--primary); font-size: 1.2rem; margin-bottom: 8px; display: block; }
        .glossary-def { color: var(--text-color); line-height: 1.6; font-size: 0.95rem; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="quiz-header">
            <h2>Board Term Glossary 📚</h2>
            <a href="index.html" class="back-btn">← Back to Main Menu</a>
        </div>

        <div class="search-container">
            <input type="text" id="glossarySearch" placeholder="Search for a term..." onkeyup="filterGlossary()">
        </div>

        <div id="glossary-results"></div>

        <div class="app-footer">Built for Tokki/Leane by Xiao/Angelo</div>
    </div>

    <script>
        const glossaryData = [
            { term: "Abfraction", definition: "A non-carious cervical lesion (V-shaped notch at the gumline) caused by heavy occlusal stress and tooth flexure (bruxism/clenching)." },
            { term: "Ameloblastoma", definition: "A highly aggressive, benign odontogenic tumor classically presenting as a 'soap bubble' or 'honeycomb' multilocular radiolucency." },
            { term: "Bell's Palsy", definition: "Unilateral facial paralysis caused by damage/inflammation to the Facial Nerve (CN VII). Patient cannot smile or close their eye on the affected side." },
            { term: "Cleidocranial Dysplasia", definition: "Genetic disorder with absent clavicles, delayed skull fusion, and massive numbers of impacted supernumerary teeth." },
            { term: "Combination Syndrome", definition: "Severe anatomical destruction when complete upper denture opposes natural lower anterior teeth. Causes anterior maxillary bone loss and tuberosity overgrowth." },
            { term: "Concrescence", definition: "Developmental anomaly where two fully formed, separate teeth are perfectly fused together STRICTLY by cementum." },
            { term: "Dens Evaginatus", definition: "Extra cusp growing outward from the central groove of a premolar (Leong's premolar), containing a tiny pulp horn that easily snaps off." },
            { term: "Dens in Dente", definition: "Enamel folding deeply inward before mineralization, most commonly affecting the maxillary lateral incisor." },
            { term: "Eagle Syndrome", definition: "Calcification of the stylohyoid ligament causing a 'bone spear' to poke the carotid artery/nerves, causing severe pain when turning the head." },
            { term: "Erythroplakia", definition: "A clinical red patch on oral mucosa that cannot be diagnosed as any other disease. Extremely high risk of malignancy (Oral Cancer)." },
            { term: "Frey's Syndrome", definition: "Sweating and flushing on the side of the face while eating, caused by severed parasympathetic nerves miswiring into sweat glands after parotid surgery." },
            { term: "Fusion", definition: "Two developing tooth buds physically fuse into one giant tooth, resulting in ONE LESS tooth in the arch count." },
            { term: "Gemination", definition: "A single tooth bud attempts to split into two, resulting in a giant, bifid crown but a normal root count." },
            { term: "Leukoplakia", definition: "A white patch on oral mucosa that cannot be rubbed off and cannot be characterized as any other disease. Considered a premalignant lesion." },
            { term: "Ludwig's Angina", definition: "A rapidly spreading, bilateral, life-threatening cellulitis of the floor of the mouth that pushes the tongue back and suffocates the patient." },
            { term: "Osteogenesis Imperfecta", definition: "Genetic defect in Type I Collagen causing 'brittle bone disease', blue sclera, and Dentinogenesis Imperfecta." },
            { term: "Papillon-Lefèvre Syndrome", definition: "Autosomal recessive condition causing severe periodontitis (loss of all teeth by age 14) and hyperkeratosis on palms and soles." },
            { term: "Pemphigus Vulgaris", definition: "Autoimmune disease where antibodies destroy desmosomes, causing intraepithelial blisters and a positive Nikolsky sign." },
            { term: "Pierre Robin Sequence", definition: "Congenital triad: Micrognathia (tiny jaw), Glossoptosis (tongue blocking airway), and U-shaped Cleft Palate." },
            { term: "Sjogren's Syndrome", definition: "Systemic autoimmune disease causing destruction of exocrine glands, resulting in profound xerostomia (dry mouth) and xerophthalmia (dry eyes)." },
            { term: "Trigeminal Neuralgia", definition: "Neuropathic condition characterized by lightning-like facial pain triggered by light touch (Tic Douloureux)." },
            { term: "Epinephrine Reversal", definition: "Paradoxical blood pressure drop when Epinephrine is given to a patient taking Alpha-blockers (leaving the Beta-2 receptors unopposed)." },
            { term: "First-Pass Effect", definition: "The massive destruction of an oral drug by the liver before it ever reaches the systemic bloodstream." },
            { term: "Malignant Hyperthermia", definition: "Lethal genetic reaction to volatile anesthetics/succinylcholine, causing muscle rigidity and extreme fever. Antidote is Dantrolene." },
            { term: "Methemoglobinemia", definition: "Dangerous condition where iron in hemoglobin is oxidized, preventing oxygen transport (blood turns chocolate brown). Caused by Prilocaine/Benzocaine. Antidote is Methylene Blue." },
            { term: "Christensen's Phenomenon", definition: "Natural separation (disclusion) of posterior teeth when the mandible slides forward into protrusion." },
            { term: "Creep", definition: "Slow, gradual deformation of material (like amalgam) under constant, static load." },
            { term: "Syneresis", definition: "Loss of water via evaporation, causing an alginate impression to shrink and distort if left sitting." },
            { term: "Metamerism", definition: "Optical illusion where two colors look identical under one light source but completely different under another." },
            { term: "Apical Delta", definition: "The highly complex, microscopic branching of tiny nerve exits at the very tip of the root." },
            { term: "Biologic Width", definition: "Mandatory 2mm space of healthy tissue above the bone required for the junctional epithelium and connective tissue attachment." },
            { term: "Phoenix Abscess", definition: "Acute, violent, painful flare-up of a previously painless, chronic apical infection." },
            { term: "Flush Terminal Plane", definition: "Normal relationship in primary teeth where the distal surfaces of the upper and lower second primary molars are perfectly flat/aligned." },
            { term: "Ugly Duckling Stage", definition: "Normal developmental phase where the erupting permanent canines push the roots of incisors together, causing crowns to temporarily flare apart (diastema)." },
            { term: "Autonomy", definition: "Ethical principle recognizing the patient's absolute right to make their own informed decisions regarding treatment." },
            { term: "Beneficence", definition: "Ethical duty to actively 'do good', promote welfare, and act in the patient's best interest." },
            { term: "Res Ipsa Loquitur", definition: "Legal doctrine meaning 'The thing speaks for itself.' Used when negligence is so obvious that no expert is required to prove it." },
            { term: "Respondeat Superior", definition: "Legal doctrine meaning 'Let the master answer.' Makes the dentist/clinic owner legally liable for mistakes made by their assistants." },
            { term: "Sensitivity", definition: "Ability of a test to correctly identify individuals who ACTUALLY HAVE the disease (True Positive Rate)." },
            { term: "Specificity", definition: "Ability of a test to correctly identify individuals who DO NOT HAVE the disease (True Negative Rate)." },
            { term: "ALARA", definition: "Guiding principle of radiation safety: 'As Low As Reasonably Achievable' to minimize patient exposure." },
            { term: "SLOB Rule", definition: "Clark's Rule: 'Same Lingual, Opposite Buccal.' If the x-ray tube moves and the object appears to move in the SAME direction, the object is on the Lingual." }
        ];

        glossaryData.sort((a, b) => a.term.localeCompare(b.term));

        function displayGlossary(terms) {
            const container = document.getElementById('glossary-results');
            container.innerHTML = '';
            terms.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glossary-card';
                card.innerHTML = `<strong class="glossary-term">${item.term}</strong><span class="glossary-def">${item.definition}</span>`;
                container.appendChild(card);
            });
        }

        function filterGlossary() {
            const query = document.getElementById('glossarySearch').value.toLowerCase();
            const filtered = glossaryData.filter(item => item.term.toLowerCase().includes(query) || item.definition.toLowerCase().includes(query));
            displayGlossary(filtered);
        }

        window.onload = () => displayGlossary(glossaryData);
    </script>
</body>
</html>
