<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokki's Board Prep - Testlet Part I</title>
    <link rel="stylesheet" href="../css/style.css">
    
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <style>
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 400px;
            margin: 30px 0;
            cursor: pointer;
        }
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flashcard-container.is-flipped .flashcard-inner {
            transform: rotateY(180deg);
        }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px; /* Slightly adjusted padding for mobile screens */
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 3px solid var(--primary-light);
            background: var(--container-bg);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* 📱 Magic fix for smooth iOS mobile scrolling */
        }
        .flashcard-front {
            justify-content: center; /* Keeps the short front text perfectly centered */
        }
        .flashcard-back {
            transform: rotateY(180deg);
            border-color: var(--primary);
            justify-content: flex-start; /* 📱 Stops long text from being pushed out of bounds at the top */
        }
        .card-category {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: bold;
        }
        .card-content {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            line-height: 1.5;
            text-align: center;
        }
        .card-rationale {
            font-size: 0.95rem;
            font-weight: normal;
            margin-top: 15px;
            color: var(--text-light);
            text-align: left;
            border-top: 1px solid var(--primary-light);
            padding-top: 15px;
        }
        .deck-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>

    <div class="quiz-container">
        
        <div class="quiz-header">

        <div class="flashcard-container" id="flashcard" onclick="flipCard()">
            <div class="flashcard-inner">
                <!-- FRONT OF CARD -->
                <div class="flashcard-front">
                    <div class="card-category" id="cardCategory">Category</div>
                    <div class="card-content" id="cardFrontText">Front text goes here...</div>
                </div>

                <div class="flashcard-back">
                    <div class="card-content" id="cardBackAnswer" style="color: var(--primary); margin-bottom: 10px;">Answer goes here...</div>
                    <div class="card-rationale" id="cardBackRationale">Rationale goes here...</div>
                </div>
            </div>
        </div>

        <div class="deck-controls">
            <button class="nav-btn" onclick="prevCard()" id="prevBtn" disabled>← Previous</button>
            <button class="nav-btn" onclick="nextCard()" id="nextBtn">Next →</button>
        </div>

        <div class="app-footer">
            Built for Tokki/Leane by Xiao/Angelo
        </div>

                answer: "E. Intramembranous",

        let currentIndex = 0;
        const flashcard = document.getElementById('flashcard');

        function loadCard(index) {
            flashcard.classList.remove('is-flipped');
            
            setTimeout(() => {
                document.getElementById('cardCounter').innerText = `Card ${index + 1} of ${deckData.length}`;
                document.getElementById('cardCategory').innerText = deckData[index].category;
                document.getElementById('cardFrontText').innerHTML = deckData[index].front;
                document.getElementById('cardBackAnswer').innerHTML = deckData[index].answer;
                document.getElementById('cardBackRationale').innerHTML = `<strong>Explanation:</strong> ${deckData[index].rationale}`;

                document.getElementById('prevBtn').disabled = index === 0;
                document.getElementById('nextBtn').disabled = index === deckData.length - 1;
            }, 150); 
        }

        function flipCard() {
            flashcard.classList.toggle('is-flipped');
        }

        function nextCard() {
            if (currentIndex < deckData.length - 1) {
                currentIndex++;
                loadCard(currentIndex);
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                loadCard(currentIndex);
            }
        }

        // Load the first card on startup
        loadCard(currentIndex);
    </script>
