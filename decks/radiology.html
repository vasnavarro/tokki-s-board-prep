<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokki's Board Prep - Radiology Deck</title>
    <link rel="stylesheet" href="../css/style.css">
    
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <style>
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 400px;
            margin: 30px 0;
            cursor: pointer;
        }
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flashcard-container.is-flipped .flashcard-inner {
            transform: rotateY(180deg);
        }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 3px solid var(--primary-light);
            background: var(--container-bg);
            overflow-y: auto;
        }
        .flashcard-back {
            transform: rotateY(180deg);
            border-color: var(--primary);
        }
        .card-category {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: bold;
        }
        .card-content {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            line-height: 1.5;
            text-align: center;
        }
        .card-rationale {
            font-size: 0.95rem;
            font-weight: normal;
            margin-top: 15px;
            color: var(--text-light);
            text-align: left;
            border-top: 1px solid var(--primary-light);
            padding-top: 15px;
        }
        .deck-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        
        <div class="quiz-header">
            <div>
                <h2>Radiology Deck ☢️</h2>
                <p id="cardCounter" style="color: var(--text-light); font-size: 0.9rem;">Card 1 of X</p>
            </div>
            <a href="../flashcards.html" class="back-btn">← Back to Decks</a>
        </div>

        <p style="text-align: center; color: var(--text-light); font-size: 0.85rem;">Click the card to flip it over.</p>

        <!-- THE 3D FLASHCARD -->
        <div class="flashcard-container" id="flashcard" onclick="flipCard()">
            <div class="flashcard-inner">
                <!-- FRONT OF CARD -->
                <div class="flashcard-front">
                    <div class="card-category" id="cardCategory">Category</div>
                    <div class="card-content" id="cardFrontText">Front text goes here...</div>
                </div>
                <!-- BACK OF CARD -->
                <div class="flashcard-back">
                    <div class="card-content" id="cardBackAnswer" style="color: var(--primary); margin-bottom: 10px;">Answer goes here...</div>
                    <div class="card-rationale" id="cardBackRationale">Rationale goes here...</div>
                </div>
            </div>
        </div>

        <div class="deck-controls">
            <button class="nav-btn" onclick="prevCard()" id="prevBtn" disabled>← Previous</button>
            <button class="nav-btn" onclick="nextCard()" id="nextBtn">Next →</button>
        </div>

        <div class="app-footer">
            Built for Tokki/Leane by Xiao/Angelo
        </div>

    </div>

    <script>
        // RADIOLOGY DECK DATA
        const deckData = [
            {
                category: "Image Characteristics",
                front: "The area from which x-rays emanate is called the:<br><br>• Target<br>• Focal spot<br>• Intensifying screen<br>• Cone",
                answer: "• Focal spot",
                rationale: "The focal spot is the area of tungsten on the anode that receives the impact of the speeding electrons and converts them into x-ray photons. It is one of three factors influencing image sharpness (the others are film composition and movement)."
            },
            {
                category: "Image Characteristics",
                front: "Which type of structure inhibits the passage of x-rays?<br><br>• Radiopaque<br>• Radiolucent",
                answer: "• Radiopaque",
                rationale: "Radiopaque structures (like metals, enamel, dentin, and bone) absorb radiation, allowing less to reach the film. They appear white on the processed film. Radiolucent structures (like soft tissue and air space) allow radiation to pass through, appearing gray to black."
            },
            {
                category: "Miscellaneous",
                front: "It is best to retain dental radiographs for how many years?<br><br>• 2 years<br>• 4 years<br>• 6 years<br>• Indefinitely",
                answer: "• Indefinitely",
                rationale: "Legally, dental radiographs are the property of the dentist and should be retained indefinitely. Patients do have a right to reasonable access, including having copies forwarded to another dentist."
            },
            {
                category: "Miscellaneous",
                front: "Osteoradionecrosis is more common:<br><br>• In the mandible<br>• In the maxilla",
                answer: "• In the mandible",
                rationale: "Osteoradionecrosis (necrosis of bone produced by ionizing radiation) is more common in the mandible, probably because of the richer vascular supply to the maxilla and the fact that the mandible is more frequently irradiated."
            },
            {
                category: "Miscellaneous",
                front: "Your dental hygienist has a patient that says she needs bite-wing x-rays because it has been six months since the last films were taken. Your hygienist should respond in which manner?",
                answer: "• Tell the patient that dental x-rays are taken only when needed as judged by each patient's needs",
                rationale: "Decisions about the frequency of dental x-rays are determined by the dentist based on each patient's unique needs, not simply a 6-month calendar schedule. Guidelines published by the ADA aid in this prescription."
            },
            {
                category: "Normal Anatomy",
                front: "The image of the coronoid process of the mandible often appears in periapical x-rays of:<br><br>• The incisor region of the mandible<br>• The molar region of the mandible<br>• The incisor region of the maxilla<br>• The molar region of the maxilla",
                answer: "• The molar region of the maxilla",
                rationale: "As the mouth is opened, the coronoid process moves forward and comes into view most often when the mouth is opened to its fullest extent. It appears as a tapered or triangular radiopacity superimposed on or below the maxillary molars."
            },
            {
                category: "Processing",
                front: "X-ray developer contains all of the following except:<br><br>• A developing agent<br>• An antioxidant preservative<br>• A clearing agent<br>• An accelerator<br>• A restrainer",
                answer: "• A clearing agent",
                rationale: "A clearing agent (such as sodium thiosulfate/hypo) is found in the FIXER, not the developer. The developer uses agents like hydroquinone to change exposed crystals to black metallic silver."
            },
            {
                category: "Processing",
                front: "X-ray fixer contains all of the following except:<br><br>• A clearing agent<br>• An antioxidant preservative<br>• An accelerator<br>• An acidifier<br>• A hardener",
                answer: "• An accelerator",
                rationale: "An accelerator (an alkali like sodium carbonate) is found in the DEVELOPER. The fixing solution contains a clearing agent, preservative, acidifier, and a hardener (potassium alum)."
            },
            {
                category: "Radiation Physics",
                front: "The amount of material that is required to reduce the intensity of an x-ray beam to half is called the:<br><br>• Value layer<br>• Intensity value layer<br>• Half-value layer<br>• Full-value layer",
                answer: "• Half-value layer",
                rationale: "The half-value layer (HVL) is an indicator of the penetrating quality of an x-ray beam. In oral diagnostic radiography, the HVL is approximately 2 mm of aluminum."
            },
            {
                category: "Radiation Characteristics",
                front: "Increasing the kilovoltage (kVp) causes the resultant x-ray to have:<br><br>• Decreased density<br>• More latitude<br>• A shorter scale of contrast<br>• A longer scale of contrast",
                answer: "• A longer scale of contrast",
                rationale: "Increasing kilovoltage produces more penetrating x-rays, reducing subject contrast and creating a longer scale of contrast (more shades of gray). Decreasing kilovoltage increases subject contrast (shorter scale)."
            },
            {
                category: "Radiation Characteristics",
                front: "The quantity of radiation produced is controlled by:<br><br>• Kilovoltage (kVp)<br>• Milliamperage (mA)<br>• Exposure time<br>• Milliamperage (mA) and exposure time",
                answer: "• Milliamperage (mA) and exposure time",
                rationale: "Milliamperage (mA) controls the quantity or number of x-rays produced. Exposure time controls the length of time x-rays are produced. Kilovoltage (kVp) controls the quality or penetrating power."
            },
            {
                category: "Processing",
                front: "Ashley has taken three panoramic x-ray films today. During the day as she developed each film, she noticed the films getting lighter and lighter. What needs to be done so that this problem can be corrected?<br><br>• Decrease the temperature<br>• Increase the temperature<br>• Replenish the developing solution<br>• Increase the mA or kVp setting",
                answer: "• Replenish the developing solution",
                rationale: "As the developing solution gets weaker (depleted), the films will get lighter. Both the developing and fixing solutions should be replenished on a daily basis and changed completely on a regular schedule."
            },
            {
                category: "Processing",
                front: "After processing a film, you notice that it appears brown in color. What is the most likely cause?<br><br>• Solutions are too strong<br>• Solutions are too weak<br>• Fixing time was not long enough<br>• Fixing time was too long<br>• Film was under-developed",
                answer: "• Fixing time was not long enough",
                rationale: "A film will appear yellowish-brown when it is not completely fixed or when it is not rinsed sufficiently. The fixer removes the unexposed silver halide crystals."
            },
            {
                category: "Radiation Biology",
                front: "Which of the following is considered radioresistant?<br><br>• Immature reproductive cells<br>• Young bone cells<br>• Mature bone cells<br>• Epithelial cells",
                answer: "• Mature bone cells",
                rationale: "In general, the greater the rate of mitosis and the more immature the cells are, the greater their susceptibility to radiation. Highly sensitive cells include lymphocytes, bone marrow, and reproductive cells. Resistant cells include mature bone, muscle, and nerve cells."
            },
            {
                category: "Radiation Biology",
                front: "It is recommended that the operator stand at least how many feet away from the patient when taking radiographs?<br><br>• Two feet<br>• Four feet<br>• Six feet<br>• Eight feet",
                answer: "• Six feet",
                rationale: "Radiation exposure to the operator can be reduced by standing at least six feet away, behind a lead shield, or both. The operator must also avoid the primary beam by positioning themselves at a 90 to 135-degree angle to the beam."
            },
            {
                category: "Radiation Characteristics",
                front: "Kilovoltage controls the speed of:<br><br>• Photons<br>• Electrons<br>• Anodes<br>• Cathodes",
                answer: "• Electrons",
                rationale: "The speed with which electrons travel from the filament (cathode) to the target (anode) depends upon the potential difference (kilovoltage). Higher kilovoltage produces x-rays with greater energy levels, shorter wavelengths, and more penetrating ability."
            },
            {
                category: "Radiation Characteristics",
                front: "The inverse square law formula is:",
                answer: "Original intensity / New intensity = New distance² / Original distance²",
                rationale: "The intensity of radiation is inversely proportional to the square of the distance from the source. For example, if you double the source-to-film distance (from an 8-inch to a 16-inch cone), the resultant beam is only one-fourth as intense."
            },
            {
                category: "Radiation Physics",
                front: "The radiation generated at the anode of the x-ray tube is called:<br><br>• Primary radiation<br>• Scattered radiation<br>• Potential radiation<br>• Reverse radiation",
                answer: "• Primary radiation",
                rationale: "Primary radiation is generated at the focal spot of the anode. Secondary (scattered) radiation arises from interactions of the primary radiation beam with the atoms in the object being imaged (usually via Compton scattering)."
            },
            {
                category: "Radiation Protection",
                front: "The removal of parts of the x-ray spectrum using absorbing materials in the x-ray beam is called:<br><br>• Elimination<br>• Filtration<br>• Collimation<br>• Reduction",
                answer: "• Filtration",
                rationale: "Filtration modifies the spectral distribution of x-rays. Aluminum disks filter out useless, long-wavelength, low-energy rays that would only add to the patient's radiation dose without reaching the film."
            },
            {
                category: "Radiation Protection",
                front: "The most effective means in reducing the time of exposure, the amount of radiation reaching the patient, and the amount of radiation scattered to the dentist is:<br><br>• A lead apron<br>• Ekta-speed film<br>• Lead diaphragms<br>• Increasing target-film distance",
                answer: "• Ekta-speed film",
                rationale: "Using the fastest speed film available (like E-speed or F-speed) is the single most effective way to reduce the total exposure time and overall radiation dose."
            },
            {
                category: "Radiation Protection",
                front: "The use of metal plates, slots, bars, etc., to confine and direct radiation to a specific region and discriminate against scattered radiation is called:<br><br>• Discrimination<br>• Collimation<br>• Filtration<br>• Coning",
                answer: "• Collimation",
                rationale: "Collimation refers to the control of the size and shape of the x-ray beam. By state law, the diameter of a circular beam at the patient's skin can be no greater than 2.75 inches."
            },
            {
                category: "Techniques",
                front: "A herringbone or diamond effect will appear on the processed film when:<br><br>• The film is bent<br>• The film is placed backwards in the mouth<br>• An improper vertical angulation is used<br>• An improper horizontal angulation is used",
                answer: "• The film is placed backwards in the mouth",
                rationale: "If the film packet is placed backwards, the x-ray beam travels through the lead foil backing first. The lead foil is embossed with a herringbone pattern that will appear on the resulting underexposed (light) film."
            },
            {
                category: "Techniques",
                front: "Image magnification may be minimized by:<br><br>• Using a short cone<br>• Placing the film as far from the tooth as possible<br>• Using a long cone<br>• Shortening the exposure time",
                answer: "• Using a long cone",
                rationale: "Using the longest source-film distance practical (a 16-inch long cone) results in more parallel x-rays reaching the film, providing greater definition and less image magnification."
            },
            {
                category: "Techniques",
                front: "Foreshortening and elongation are produced by:<br><br>• Incorrect horizontal angulation<br>• Incorrect vertical angulation<br>• Either of the above",
                answer: "• Incorrect vertical angulation",
                rationale: "Excessive (too steep) vertical angulation causes foreshortened images. Insufficient (too flat) vertical angulation causes elongated images. Incorrect horizontal angulation causes overlapping contacts."
            },
            {
                category: "Techniques",
                front: "Which of the following errors in radiographic technique is the most likely reason that an image on a radiograph would appear elongated?<br><br>• Too much vertical angulation<br>• Too little vertical angulation<br>• Incorrect horizontal angulation<br>• Beam not aimed at center of film",
                answer: "• Too little vertical angulation",
                rationale: "Too little (flat) vertical angulation stretches the image out, causing elongation. If the beam is not aimed at the center of the film, it causes a 'cone cut' (a clear curved line)."
            },
            {
                category: "Techniques",
                front: "Which of the following is a major disadvantage of the paralleling technique?<br><br>• The image formed will not have dimensional accuracy<br>• Periodontal bone height cannot be accurately diagnosed<br>• An increase in exposure time is necessary due to the use of a long cone",
                answer: "• An increase in exposure time is necessary due to the use of a long cone",
                rationale: "To keep the film parallel to the tooth, the object-film distance must be increased. To compensate for the resulting magnification, a long cone (16-inch) is used, which slightly increases required exposure time due to the Inverse Square Law."
            },
            {
                category: "Techniques",
                front: "Which of the following is not a disadvantage of the bisecting technique?<br><br>• Image on x-ray film may be dimensionally distorted<br>• Increased exposure time<br>• Image is not a true reproduction of the object<br>• May not be able to judge correct alveolar bone height",
                answer: "• Increased exposure time",
                rationale: "Exposure time is actually decreased in the bisecting technique because a shorter cone (8-inch) is typically used. However, it causes dimensional distortion and makes evaluating bone height difficult."
            },
            {
                category: "Techniques",
                front: "Name the two x-ray projection techniques used in intraoral dental radiography.",
                answer: "1. Bisecting technique<br>2. Paralleling technique",
                rationale: "Paralleling directs the central ray perpendicular to both the tooth and film. Bisecting directs the central ray perpendicular to an imaginary line that bisects the angle between the tooth and the film."
            },
            {
                category: "X-rays",
                front: "Which of the following projections is best for examination of fractures of the zygomatic arch?<br><br>• Waters projection<br>• Submentovertex projection<br>• Reverse Towne projection<br>• Lateral cephalometric projection",
                answer: "• Submentovertex projection",
                rationale: "In this projection, the neck is maximally extended, and the x-ray beam enters under the chin and exits at the vertex. The zygomatic arches stand out like the 'handles of a jug'."
            },
            {
                category: "X-rays",
                front: "Which of the following projections is best for examination of the maxillary sinus?<br><br>• Lateral jaw projection<br>• Reverse Towne projection<br>• Waters projection<br>• Submentovertex projection",
                answer: "• Waters projection",
                rationale: "The Waters projection is a posteroanterior projection with the patient's chin elevated. It is the most useful conventional technique to image the maxillary sinuses and mid-facial fractures."
            },
            {
                category: "X-rays",
                front: "Which of the following projections is best for examination of the condyles and neck of the mandible (from an anterior-posterior projection)?<br><br>• Waters projection<br>• Transcranial projection<br>• Townes projection<br>• Submentovertex projection",
                answer: "• Townes projection",
                rationale: "The Townes projection eliminates the superimposition of the mastoid and zygoma, giving excellent visualization of the condylar neck and rami. The 'Reverse Towne' is used for fractures of the condylar neck."
            },
            {
                category: "X-rays",
                front: "All of the following are advantages of a panoramic radiograph except:<br><br>• Shows areas not visible on a full mouth series<br>• Shows both arches on the same film<br>• Gives better detail and definition than periapical radiographs<br>• More comfortable for the patient",
                answer: "• Gives better detail and definition than periapical radiographs",
                rationale: "This is false; a panorex gives LESS detail and definition than periapical radiographs due to intensifying screens, movement of the tube/film, and increased object-film distance. Bite-wings are still required for caries detection."
            },
            {
                category: "X-rays",
                front: "A phenomenon caused by a relatively lower x-ray absorption on the mesial or distal aspect of teeth, between the edge of the enamel and the adjacent crest of the alveolar ridge is called:<br><br>• Apical burnout<br>• Cervical burnout<br>• Coronal burnout<br>• Root burnout",
                answer: "• Cervical burnout",
                rationale: "Due to the normal anatomical configuration of the CEJ, there is less tooth mass to absorb x-rays in this area. It appears as an ill-defined radiolucency and should not be mistaken for interproximal root caries."
            },
            {
                category: "X-rays",
                front: "Which of the following types of intra-oral radiographs are most useful in detecting interproximal caries?<br><br>• Periapical radiographs<br>• Bitewing radiographs<br>• Occlusal radiographs",
                answer: "• Bitewing radiographs",
                rationale: "Bitewings show the crowns of both maxillary and mandibular teeth, making them the gold standard for detecting interproximal caries and evaluating crestal bone levels."
            },
            {
                category: "Radiation Biology",
                front: "The period between radiation exposure and the onset of symptoms is called the:<br><br>• Latent period<br>• Period of cell injury<br>• Recovery period",
                answer: "• Latent period",
                rationale: "The latent period is the time between radiation exposure and the onset of observable symptoms. It may be short or long depending on the total dose received and the amount of time it took to receive it."
            },
            {
                category: "Digital Radiology",
                front: "Which type of digital image receptor is most common at this time?<br><br>• CID (Charge Injection Device)<br>• CMOS / APS (Complementary Metal Oxide Semiconductor)<br>• CCD (Charge-Coupled Device)",
                answer: "• CCD (Charge-Coupled Device)",
                rationale: "The CCD consists of a silicon chip with an active array of pixels. It is the most common device used in direct digital radiography systems."
            },
            {
                category: "Digital Radiology",
                front: "All of the following are advantages of digital radiography except:<br><br>• Digital subtraction<br>• The ability to enhance the image<br>• Size of the intraoral sensor<br>• Patient education",
                answer: "• Size of the intraoral sensor",
                rationale: "The bulkiness and rigid thickness (ranging from 3.2 mm to 8.8 mm) of the digital sensor is considered a major disadvantage because it can be uncomfortable for the patient compared to traditional film."
            },
            {
                category: "Digital Radiology",
                front: "The method of obtaining a digital image similar to scanning a photograph to a computer screen is termed:<br><br>• Indirect digital imaging<br>• Direct digital imaging<br>• Storage phosphor imaging<br>• CMOS / APS",
                answer: "• Indirect digital imaging",
                rationale: "Indirect digital imaging involves exposing a conventional x-ray film, processing it, and then scanning it into a computer to digitize the analog image."
            },
            {
                category: "Digital Radiology",
                front: "Digital radiography requires less radiation than conventional radiography because:<br><br>• The sensor is larger<br>• The exposure time is increased<br>• The sensor is more sensitive to x-rays<br>• The pixels sense transmitted light quickly",
                answer: "• The sensor is more sensitive to x-rays",
                rationale: "The CCD/CMOS sensor is much more sensitive to x-rays than conventional E-speed film. Exposure times for digital radiography are 50% to 80% shorter, translating to significantly less radiation exposure for the patient."
            }
        ];

        let currentIndex = 0;
        const flashcard = document.getElementById('flashcard');

        function loadCard(index) {
            flashcard.classList.remove('is-flipped');
            
            setTimeout(() => {
                document.getElementById('cardCounter').innerText = `Card ${index + 1} of ${deckData.length}`;
                document.getElementById('cardCategory').innerText = deckData[index].category;
                document.getElementById('cardFrontText').innerHTML = deckData[index].front;
                document.getElementById('cardBackAnswer').innerHTML = deckData[index].answer;
                document.getElementById('cardBackRationale').innerHTML = `<strong>Explanation:</strong> ${deckData[index].rationale}`;

                document.getElementById('prevBtn').disabled = index === 0;
                document.getElementById('nextBtn').disabled = index === deckData.length - 1;
            }, 150); 
        }

        function flipCard() {
            flashcard.classList.toggle('is-flipped');
        }

        function nextCard() {
            if (currentIndex < deckData.length - 1) {
                currentIndex++;
                loadCard(currentIndex);
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                loadCard(currentIndex);
            }
        }

        loadCard(currentIndex);
    </script>
</body>
</html>
